<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRM Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>CRM Panel</h2>
    <a href="#">📊 Dashboard</a>
    <a href="#">👤 Leads</a>
    <a href="#">💼 Deals</a>
    <a href="#">📞 Contacts</a>
    <a href="#">⚙️ Settings</a>
  </div>

  <!-- Main -->
  <div class="main">

    <h1>Dashboard</h1>

    <!-- KPI Cards -->
    <div class="grid">
      <div class="card">
        <div class="kpi-title">Total Leads</div>
        <div class="kpi-value">128</div>
      </div>

      <div class="card">
        <div class="kpi-title">Active Deals</div>
        <div class="kpi-value">34</div>
      </div>

      <div class="card">
        <div class="kpi-title">Won</div>
        <div class="kpi-value">19</div>
      </div>

      <div class="card">
        <div class="kpi-title">Revenue</div>
        <div class="kpi-value">$12.4K</div>
      </div>
    </div>

    <!-- Table -->
    <table>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Source</th>
        <th>Action</th>
      </tr>

      <tr>
        <td>John Doe</td>
        <td>New</td>
        <td>Website</td>
        <td><button class="btn btn-primary">View</button></td>
      </tr>

      <tr>
        <td>Sarah Smith</td>
        <td>In Progress</td>
        <td>Instagram</td>
        <td><button class="btn btn-primary">View</button></td>
      </tr>
    </table>

  </div>

</div>

</body>
</html>
